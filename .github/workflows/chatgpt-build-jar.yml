name: Temporary EnthusiaEvents JAR build

on:
  push:
    branches:
      - chatgpt-build-events-jar
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build
        run: mvn -B clean package

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: EnthusiaEvents-jar
          path: target/*.jar
          if-no-files-found: error
