name: Quality

on:
  pull_request:
  push:
    branches:
      - main
      - nested-event-worlds

permissions:
  contents: write

jobs:
  verify:
    name: Maven verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Apply nested event world changes
        run: python .github/apply-nested-event-worlds.py

      - name: Compile and run quality checks
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Materialize verified source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add nested event world support [skip ci]"
          git push origin HEAD:${{ github.ref_name }}

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: EnthusiaEvents-${{ github.sha }}
          path: target/enthusia-events-1.0.0-SNAPSHOT.jar
          if-no-files-found: error
