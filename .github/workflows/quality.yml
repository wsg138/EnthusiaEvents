name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    name: Maven verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply staged retest source fixes
        if: ${{ hashFiles('.github/retest-bug-sweep.patch') != '' }}
        run: git apply --whitespace=fix .github/retest-bug-sweep.patch

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Compile and run quality checks
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: EnthusiaEvents-${{ github.sha }}
          path: target/enthusia-events-1.0.0-SNAPSHOT.jar
          if-no-files-found: error

      - name: Commit verified staged fixes to main
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && hashFiles('.github/retest-bug-sweep.patch') != '' }}
        run: |
          rm .github/retest-bug-sweep.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Apply verified production retest fixes [skip ci]"
            git push origin HEAD:main
          fi
